<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>银行年报问答 · 10家A股上市银行 2023</title>
<style>
  :root{
    --ink:#0f1c2e; --muted:#66758a; --line:#e3e8ef; --bg:#f4f6f9;
    --card:#ffffff; --brand:#0b5c4b; --brand2:#0e7a63; --accent:#c9a227;
    --soft:#eef5f2; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.7}
  header{background:linear-gradient(135deg,#0b3b32 0%,#0b5c4b 55%,#117a63 100%);
         color:#fff;padding:26px 0 22px;border-bottom:3px solid var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.12);
        border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:22px}
  h1{font-size:22px;margin:0;font-weight:650;letter-spacing:.5px}
  .sub{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:3px}
  .stats{margin-left:auto;display:flex;gap:26px;text-align:right}
  .stats b{display:block;font-size:19px;font-weight:650;color:#fff}
  .stats span{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.5px}
  main{max-width:1180px;margin:26px auto 60px;padding:0 24px}
  .search{background:var(--card);border:1px solid var(--line);border-radius:14px;
          padding:18px 18px 14px;box-shadow:0 2px 10px rgba(15,28,46,.04)}
  .search-row{display:flex;gap:10px}
  #q{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;font-size:15px;
     outline:none;font-family:inherit;transition:.18s;background:#fbfcfd}
  #q:focus{border-color:var(--brand2);background:#fff;box-shadow:0 0 0 3px rgba(14,122,99,.1)}
  #ask{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:0 26px;font-size:15px;
       font-weight:600;cursor:pointer;font-family:inherit;transition:.18s;white-space:nowrap}
  #ask:hover{background:var(--brand2)}
  #ask:disabled{opacity:.55;cursor:not-allowed}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{border:1px solid var(--line);background:#fbfcfd;border-radius:20px;padding:5px 13px;
        font-size:12.5px;color:#44536a;cursor:pointer;transition:.15s;font-family:inherit}
  .chip:hover{border-color:var(--brand2);color:var(--brand);background:var(--soft)}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}
  .layout{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:20px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        box-shadow:0 2px 10px rgba(15,28,46,.04)}
  .card-head{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);
             font-size:13px;font-weight:650;letter-spacing:.4px;color:#334155}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--brand2)}
  .answer{padding:22px 24px;min-height:300px;font-size:14.5px;color:#1e2c40;white-space:pre-wrap}
  .answer .cite{display:inline-block;background:var(--soft);color:var(--brand);border:1px solid #cfe3dc;
                border-radius:5px;font-size:11px;padding:0 5px;line-height:17px;margin:0 2px;
                vertical-align:1px;font-weight:600}
  .placeholder{color:#9aa7b8;font-size:14px;display:flex;flex-direction:column;align-items:center;
               justify-content:center;height:260px;gap:12px;text-align:center}
  .placeholder .big{font-size:38px;opacity:.35}
  .spinner{width:22px;height:22px;border:2.5px solid #dbe3ec;border-top-color:var(--brand2);
           border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .meta-line{font-size:12px;color:var(--muted);padding:0 24px 16px}
  .cites{padding:8px 12px 14px}
  .cite-item{padding:11px 10px;border-radius:9px;border:1px solid transparent;transition:.15s}
  .cite-item:hover{background:#fafcfb;border-color:var(--line)}
  .cite-item .co{font-size:13px;font-weight:650;color:#18263a}
  .cite-item .loc{font-size:11.5px;color:var(--muted);margin-top:2px}
  .cite-item .snip{font-size:11.5px;color:#7a8798;margin-top:6px;display:-webkit-box;
                   -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badge{display:inline-block;background:var(--soft);color:var(--brand);border-radius:4px;
         font-size:10.5px;padding:0 5px;margin-left:5px;font-weight:600;vertical-align:1px}
  details{margin-top:20px}
  details summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:12px 18px;
                  background:var(--card);border:1px solid var(--line);border-radius:10px;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details[open] summary{border-radius:10px 10px 0 0;border-bottom-color:transparent}
  .retr{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;
        padding:6px 18px 16px}
  .retr-row{display:flex;gap:14px;align-items:center;font-size:12px;padding:7px 0;
            border-bottom:1px dashed #edf1f5;color:#40506a}
  .retr-row:last-child{border-bottom:0}
  .retr-row .score{margin-left:auto;color:#8593a6;font-variant-numeric:tabular-nums;font-size:11px}
  .retr-row .co{font-weight:600;min-width:76px}
  .empty-side{padding:26px 18px;color:#9aa7b8;font-size:12.5px;text-align:center}
  footer{max-width:1180px;margin:0 auto;padding:0 24px 40px;color:#8b97a8;font-size:11.5px;text-align:center}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.stats{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap brand">
    <div class="logo">🏦</div>
    <div>
      <h1>银行年报问答</h1>
      <div class="sub">10 家 A 股上市银行 · 2023 年度报告 · 逐页抽取，保留表格行列</div>
    </div>
    <div class="stats">
      <div><b>10</b><span>家银行</span></div>
      <div><b>4,001</b><span>页原文</span></div>
      <div><b>BM25 + 向量</b><span>混合检索</span></div>
    </div>
  </div>
</header>

<main>
  <div class="search">
    <div class="search-row">
      <input id="q" placeholder="例如：招商银行 2023 年营业收入是多少？各家公司的不良贷款率谁最高？" autocomplete="off">
      <button id="ask" onclick="ask()">提问</button>
    </div>
    <div class="chips">
      <button class="chip" onclick="fill(this)">招商银行2023年营业收入和净利润分别是多少？</button>
      <button class="chip" onclick="fill(this)">比较工商银行、建设银行、农业银行2023年的不良贷款率</button>
      <button class="chip" onclick="fill(this)">哪家银行2023年净息差最高？</button>
      <button class="chip" onclick="fill(this)">中国银行2023年核心一级资本充足率是多少？</button>
      <button class="chip" onclick="fill(this)">各银行2023年归属于母公司股东的净利润排名</button>
    </div>
    <div class="hint">回答只依据检索到的年报原文，每个关键数字标注「公司 + 年报页码」，可点击右侧出处核对。</div>
  </div>

  <div class="layout">
    <div>
      <div class="card">
        <div class="card-head"><span class="dot"></span>回答</div>
        <div class="answer" id="answer">
          <div class="placeholder">
            <div class="big">📊</div>
            <div>输入问题，开始检索 10 份银行年报</div>
            <div style="font-size:12px;color:#aab5c3">支持单家公司查询，也支持跨公司比较</div>
          </div>
        </div>
        <div class="meta-line" id="meta"></div>
      </div>
      <details id="details" style="display:none">
        <summary>检索详情 · 混合检索得分（向量 55% + BM25 45%）</summary>
        <div class="retr" id="retr"></div>
      </details>
    </div>

    <div class="card">
      <div class="card-head"><span class="dot"></span>出处</div>
      <div class="cites" id="cites"><div class="empty-side">提问后显示引用的年报页面</div></div>
    </div>
  </div>
</main>

<footer>数据来源：各银行 2023 年年度报告（上交所/巨潮资讯公开披露）· 仅供课程作业演示，不构成投资建议</footer>

<script>
function fill(el){ document.getElementById('q').value = el.textContent; ask(); }

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtAnswer(t){
  let s = esc(t);
  s = s.replace(/\[资料(\d+)\]/g, '<span class="cite">资料$1</span>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return s;
}

async function ask(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  const btn = document.getElementById('ask');
  btn.disabled = true; btn.textContent = '检索中…';
  document.getElementById('answer').innerHTML =
    '<div class="placeholder"><div class="spinner"></div><div>正在检索年报并生成回答，约需 10–30 秒…</div></div>';
  document.getElementById('meta').textContent = '';
  document.getElementById('cites').innerHTML = '<div class="empty-side">检索中…</div>';
  document.getElementById('details').style.display = 'none';
  const t0 = Date.now();
  try{
    const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
                                     body:JSON.stringify({question:q})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || '请求失败');
    document.getElementById('answer').innerHTML = fmtAnswer(d.answer);
    document.getElementById('meta').textContent =
      '检索用时 ' + ((Date.now()-t0)/1000).toFixed(1) + ' 秒 · 引用 ' + d.citations.length + ' 个原文片段';
    document.getElementById('cites').innerHTML = d.citations.map((c,i)=>
      `<div class="cite-item">
         <div class="co">[资料${i+1}] ${esc(c.company)}<span class="badge">${c.page} 页</span></div>
         <div class="loc">${c.year} 年年度报告${c.section ? ' · ' + esc(c.section) : ''}</div>
         <div class="snip">${esc(c.section || '')}</div>
       </div>`).join('');
    document.getElementById('retr').innerHTML = d.retrieved.map(h=>
      `<div class="retr-row">
         <span class="co">${esc(h.company)}</span>
         <span>第 ${h.page} 页</span>
         <span class="score">综合 ${h.score} · 向量 ${h.vector} · BM25 ${h.bm25}</span>
       </div>`).join('');
    document.getElementById('details').style.display = 'block';
  }catch(e){
    document.getElementById('answer').innerHTML =
      '<div class="placeholder"><div style="font-size:30px">⚠️</div><div>请求失败：' + esc(e.message) + '</div></div>';
  }finally{
    btn.disabled = false; btn.textContent = '提问';
  }
}
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') ask(); });
const autoQ = new URLSearchParams(location.search).get('q');
if(autoQ){ document.getElementById('q').value = autoQ; ask(); }
</script>
</body>
</html>
